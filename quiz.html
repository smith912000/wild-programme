<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>The Threshold — a short honest check</title>
<meta name="description" content="Six questions. Answer honestly and go where the answers point.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #050309;
    --surface:   #120C1F;
    --surface-2: #160F26;
    --border:    rgba(244,241,237,.08);
    --border-lit:rgba(99,73,184,.45);
    --text:      #F4F1ED;
    --dim:       rgba(244,241,237,.58);
    --dimmer:    rgba(244,241,237,.38);
    --indigo:    #6349B8;
    --indigo-2:  #8A6FE0;
    --amber:     #C9A84C;
    --amber-lit: #E9C766;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
    --ease-out: cubic-bezier(.16,1,.3,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 18px; }
  .container { max-width:540px; width:100%; }
  h1 { font-family:var(--serif); font-weight:600; font-size:1.9rem; line-height:1.15; margin-bottom:10px; }
  .lede { color:var(--dim); font-size:.95rem; line-height:1.55; margin-bottom:28px; }
  .progress { display:flex; gap:6px; margin-bottom:22px; }
  .progress span { flex:1; height:2px; background:var(--border); border-radius:2px; transition:background .4s var(--ease-out); }
  .progress span.done { background:var(--indigo-2); }
  .q { font-family:var(--serif); font-size:1.35rem; font-weight:600; line-height:1.25; margin-bottom:18px; }
  .opt { display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; color:var(--text); font-family:var(--sans); font-size:.95rem; line-height:1.45; cursor:pointer; margin-bottom:10px; transition:border-color .25s, background .25s; }
  .opt:hover { border-color:var(--border-lit); background:var(--surface-2); }
  .result h2 { font-family:var(--serif); font-weight:600; font-size:1.7rem; line-height:1.2; margin-bottom:12px; }
  .result p { color:var(--dim); font-size:.95rem; line-height:1.6; margin-bottom:24px; }
  .cta { display:inline-block; background:var(--indigo); color:var(--text); text-decoration:none; border-radius:12px; padding:14px 26px; font-size:.95rem; letter-spacing:.02em; transition:background .25s; }
  .cta:hover { background:var(--indigo-2); }
  .cta.quiet { background:transparent; border:1px solid var(--border-lit); }
  .brand { font-family:var(--serif); letter-spacing:.16em; color:var(--dimmer); font-size:.85rem; margin-bottom:26px; }
  .fade { animation:fade .5s var(--ease-out); }
  @keyframes fade { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
</style>
</head>
<body>
<main class="container">
  <div class="brand">W I L D</div>
  <div id="app"></div>
</main>
<script>
const QUESTIONS = [
  { q: "You learn a practice takes weeks of quiet repetition before anything happens. What do you feel?",
    opts: [
      ["Honestly? I'd lose interest.", 0],
      ["Curious, but I know I tend to drift off things.", 1],
      ["That's how anything real works. Fine by me.", 2],
    ]},
  { q: "Do you keep any daily practice right now — journal, meditation, training, anything?",
    opts: [
      ["No, nothing regular.", 0],
      ["On and off. It comes and goes.", 1],
      ["Yes, most days.", 2],
    ]},
  { q: "This practice asks you to wake in the early hours, deliberately, and stay still. Would you?",
    opts: [
      ["That sounds like too much.", 0],
      ["I'd try it once to see.", 1],
      ["Yes. If it's part of the work, it's part of the work.", 2],
    ]},
  { q: "What are you actually here for?",
    opts: [
      ["A quick trick to try tonight.", 0],
      ["Something interesting to read about.", 1],
      ["A discipline I can build over time.", 2],
    ]},
  { q: "Night one gives you nothing. Night two, nothing. What do you do?",
    opts: [
      ["Conclude it doesn't work.", 0],
      ["Take a break, maybe come back later.", 1],
      ["Adjust one thing and go again.", 2],
    ]},
  { q: "Would you start writing down whatever you remember from your sleep — starting tomorrow morning?",
    opts: [
      ["Probably not, I wouldn't keep it up.", 0],
      ["Maybe, if I remember to.", 1],
      ["Yes. Pen goes by the bed tonight.", 2],
    ]},
];
const PASS = 9; // of 12
const QUALIFIED_URL = "https://smith912000.github.io/wild-programme/";
const MORE_WORK_URL = "https://drive.google.com/drive/folders/1DluByo0Iu4RDwY944HT63n4Xn6M2S1ps?usp=drive_link";

let i = 0, score = 0;
const app = document.getElementById("app");

function intro() {
  app.innerHTML = `<div class="fade">
    <h1>Six questions before the door.</h1>
    <p class="lede">This practice isn't for everyone, and it doesn't pretend to be. Answer honestly — there's no wrong result, only the right next step for where you are.</p>
    <button class="opt" onclick="render()">Begin</button>
  </div>`;
}

function render() {
  if (i >= QUESTIONS.length) return finish();
  const item = QUESTIONS[i];
  const bars = QUESTIONS.map((_, n) => `<span class="${n < i ? "done" : ""}"></span>`).join("");
  app.innerHTML = `<div class="fade">
    <div class="progress">${bars}</div>
    <div class="q">${item.q}</div>
    ${item.opts.map(([label, pts]) => `<button class="opt" onclick="answer(${pts})">${label}</button>`).join("")}
  </div>`;
}

function answer(pts) { score += pts; i++; render(); }

function finish() {
  if (score >= PASS) {
    app.innerHTML = `<div class="fade result">
      <h2>The door is open to you.</h2>
      <p>Your answers say you're ready to treat this as a practice, not a curiosity. That's the only entry requirement that matters here.</p>
      <a class="cta" href="${QUALIFIED_URL}">Enter the WILD Programme →</a>
    </div>`;
  } else {
    app.innerHTML = `<div class="fade result">
      <h2>There's more work to do.</h2>
      <p>No judgement — most people aren't ready to hold a practice like this yet, and forcing it wastes your time. Start here instead, and come back when the answers change.</p>
      <a class="cta quiet" href="${MORE_WORK_URL}">Begin the groundwork →</a>
    </div>`;
  }
}

intro();
</script>
</body>
</html>
